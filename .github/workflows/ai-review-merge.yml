name: AI Review And Merge

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: ai-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review-and-merge:
    name: review-and-merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted gate code from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Review current head and enable guarded auto-merge
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_TIMEOUT_SECONDS: ${{ vars.AI_REVIEW_TIMEOUT_SECONDS }}
          AUTO_MERGE_TRUSTED_ACTORS: ${{ vars.AUTO_MERGE_TRUSTED_ACTORS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_CHECKS_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python scripts/run_ai_review_gate.py
